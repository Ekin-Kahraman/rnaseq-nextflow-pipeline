name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Generate test data
        run: python test/create_test_data.py

      - name: Validate Nextflow config
        run: nextflow config -profile test,docker

      - name: Build test HISAT2 index
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/test:/data" \
            quay.io/biocontainers/hisat2:2.2.1--hdbdd923_6 \
            hisat2-build -q /data/genome.fa /data/genome

      - name: Verify production DESeq failures do not fall back
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/data" -w /data \
            quay.io/biocontainers/bioconductor-deseq2:1.42.0--r43hf17093f_2 \
            Rscript test/test_deseq2_fallback.R

      - name: Test input validation
        run: nextflow run test/test_input_validation.nf

      - name: Test output validation
        run: python -m unittest discover -s test -p 'test_validate_outputs.py' -v

      - name: Run pipeline (test profile)
        run: |
          nextflow run main.nf \
            -profile test,docker \
            --genome_index "$GITHUB_WORKSPACE/test/genome" \
            --gtf "$GITHUB_WORKSPACE/test/genes.gtf"

      - name: Verify outputs
        run: python scripts/validate_outputs.py results --samplesheet test/samplesheet.csv

      - name: Test report portal
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud/report-portal/requirements.txt
          pytest cloud/report-portal/tests

      - name: Build report portal image
        run: docker build -t rnaseq-report-portal cloud/report-portal
